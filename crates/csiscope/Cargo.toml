[package]
name = "csiscope"
description = "Live CSI oscilloscope and operator console for csid — realtime waterfall, spectrum, phase, CIR and Doppler views over a self-contained no-auth web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
name = "csiscope"
path = "src/lib.rs"

[[bin]]
name = "csiscope"
path = "src/main.rs"

# The analysis path is the console's entire cost, and it runs on the node that
# is capturing. Keeping the bench in-tree means a regression shows up as a
# number here rather than as dropped records in the field.
[[bench]]
name = "frame"
harness = false

[dependencies]
# The format and the daemon's own configuration/validation code. Depending on
# `csid` rather than re-deriving the schema is deliberate: the console must
# reject an impossible capture exactly the way `csid validate` does.
csiq = { workspace = true }
csid = { path = "../csid", version = "0.3.0" }

anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# HTTP + WebSocket. Pure Rust the whole way down, so the aarch64 cross-build
# stays a plain `cargo build --target`.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
] }

# FFT for the channel impulse response and the Doppler spectrogram.
rustfft = "6"

# The f32 section of every frame is memcpy'd to the wire rather than encoded
# one `to_le_bytes` at a time. `bytemuck` is how that cast stays safe.
bytemuck = "1"

# Views that are independent of one another (per-chain spectra, the percentile
# bundle, waterfall quantisation) run on a pool sized in `pipeline.rs`. The
# pool is deliberately smaller than the machine: `csid`'s RX thread has first
# claim on this Pi, and the console is niced below it.
rayon = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
