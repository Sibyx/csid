[project]
name = "csiq"
version = "0.1.0"
description = "Reference reader for the CSIQ Interchange Format v1 (Wi-Fi Channel State Information)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
keywords = ["csi", "wifi", "sensing", "802.11", "channel-state-information"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
# The parser is pure standard library. NumPy is only needed for
# CsiRecord.matrix(); install the `numpy` extra to enable it.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/Sibyx/csid"
Specification = "https://github.com/Sibyx/csid/blob/master/docs/CSIQ-format-v1.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csiq"]
