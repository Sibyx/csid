name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Style and lints are their own jobs, so a formatting or lint failure is
  # visible on every push without holding back the binaries the fleet runs.
  fmt:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The real target: the capture path (netlink, debugfs, realtime scheduling)
  # only compiles on Linux, so this is the job that proves the daemon builds.
  linux:
    name: build + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace

  # Proves the crate split holds: `csiq` and the portable half of `csid` must
  # build without Linux, so the format stays vendorable anywhere and the daemon
  # can be developed on a non-Linux machine.
  portable:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace

  # The binaries the fleet runs. `roles/csid` in monad-knowledge downloads the
  # artifact of the exact commit checked out on the control node, so a node
  # never compiles anything (a Pi 5 build took ~13 min and starved captures of
  # memory). Native arm64 on the SAME Ubuntu release as the node image (24.04,
  # glibc 2.39): a binary linked against a newer glibc does not start on a node,
  # so this runner is pinned and moves only when the node image moves. The
  # tests run here, on the target architecture, before anything is uploaded;
  # the artifact exists only for a commit whose shipped crates passed.
  pi-release:
    name: pi release (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the shipped crates on aarch64
        run: cargo test -p csiq -p csid -p csiscope -p collector
      - name: Release build
        run: cargo build --release -p csid -p csiscope -p collector
      - name: Stage the binaries with a manifest
        run: |
          mkdir -p dist
          cp target/release/csid target/release/csiscope target/release/collectord dist/
          cd dist
          sha256sum csid csiscope collectord > SHA256SUMS
          echo "${GITHUB_SHA}" > COMMIT
          ldd --version | head -n 1 > GLIBC
          ./csid --version > VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: csid-aarch64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  # `csid-prune` is the only thing in this repo that deletes measurements, and
  # until 2026-08-18 it had no test — which is how it came to keep `capture.csiq`
  # forever while its own header described a reclaimed spool. The suite asserts
  # the invariants whose violation loses data, above all that a session with no
  # `.synced` marker is never touched at any disk pressure.
  helpers:
    name: shell helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck rclone
          shellcheck scripts/csid-sync scripts/csid-prune tests/prune.sh
      - name: csid-prune invariants
        run: tests/prune.sh

  # The format's cross-language claim is only real if it is tested: Rust writes
  # a CSIQ file, Python reads it back and must agree field for field.
  interop:
    name: rust -> python interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reference reader
        run: pip install numpy ./python
      - name: Build csid
        run: cargo build --release -p csid
      - name: Synthesise a raw capture, export, and read it from Python
        run: python3 tests/interop.py
